<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flores amarillas para mi papoi 🌼</title>
    <meta name="description"
        content="Un hermoso paisaje al estilo Studio Ghibli con flores amarillas meciéndose en la brisa.">

    <!-- Google Fonts for Studio Ghibli Aesthetics -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Playfair+Display:ital,wght@0,600;1,400&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Studio Ghibli Parallax Meadow Artwork Background -->
    <div class="ghibli-scene" id="ghibliScene">
        <div class="ghibli-bg-layer"></div>
        <div class="sunbeam-overlay"></div>
    </div>

    <!-- Canvas for Ghibli Wind Currents, Dandelion Seeds & Golden Petals -->
    <canvas id="ghibliCanvas"></canvas>

    <!-- Main Container -->
    <div class="app-container">

        <!-- Header Card with Elegant Message -->
        <header class="ghibli-message-card">
            <span class="card-tag">Para mi hermosa pinchecha ❤️</span>
            <h1 class="main-title">Para ti, unas flores amarillas mi pastelito 🌼💛</h1>
            <p class="sub-title">"Se que no es mucho y que lo mejor sería dártelas en persona, pero espero que te guste
                mi amorcito bello ❤️"</p>
            <p class="sub-title">Posdata: pícale a la pantalla y verás que pasa 😋❤️</p>
        </header>

        <!-- Studio Ghibli Sunflower Bouquet Centerpiece -->
        <div class="flower-centerpiece-container">
            <div class="flower-glow"></div>
            <img src="assets/ghibli_flowers.jpg" alt="Flores Amarillas Ghibli" class="ghibli-bouquet-img">
        </div>

    </div>

    <script src="script.js"></script>
</body>

</html>
